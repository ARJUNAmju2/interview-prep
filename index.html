.btn-refresh:hover{border-color:#0ea5e9;color:#0ea5e9}
.links{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}

.link-interview:hover{box-shadow:0 12px 40px rgba(14,165,233,.35)}
.link-timetable{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 4px 20px rgba(245,158,11,.25)}
.link-timetable:hover{box-shadow:0 12px 40px rgba(245,158,11,.35)}
.link-english{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 4px 20px rgba(16,185,129,.25)}
.link-english:hover{box-shadow:0 12px 40px rgba(16,185,129,.35)}
.link-icon{font-size:2.8rem;display:block;margin-bottom:10px}
.link-title{font-size:1.2rem;font-weight:700;color:#fff;margin-bottom:4px}
.link-desc{font-size:.82rem;color:rgba(255,255,255,.8)}
.footer{color:#334155;font-size:.78rem;margin-top:20px}
.time{color:#0ea5e9;font-size:.9rem;font-weight:500;margin-bottom:20px}
</style>
<link rel="stylesheet" href="responsive.css">
</head>
<body>

<h1>My Prep Hub</h1>
<p class="subtitle">Stay focused. Stay consistent. Crack it.</p>

<span class="quote-icon" id="qIcon">💡</span>

<div class="links">
<a href="interview.html" class="link-card link-interview">
<span class="link-icon">🎯</span>
<div class="link-title">Interview Prep</div>
<div class="link-desc">OOPs, C#, SQL, MVC, Web API & more</div>
</a>
<a href="timetable.html" class="link-card link-timetable">
<span class="link-icon">📅</span>
<div class="link-title">Timetable</div>
<div class="link-desc">44-day study planner</div>
</a>
</div>

<div style="display:flex;gap:10px;justify-content:center;margin-bottom:16px">
<a href="assignment.html" style="padding:8px 14px;background:linear-gradient(135deg,#ec4899,#db2777);border-radius:8px;color:#fff;text-decoration:none;font-size:.73rem;font-weight:600">📝 Assignments</a>

<script>
const QUOTES=[

function showQuote(){
const q=QUOTES[Math.floor(Math.random()*QUOTES.length)];
document.getElementById('qIcon').textContent=q.i;
document.getElementById('quoteText').textContent='"'+q.t+'"';
document.getElementById('quoteAuthor').textContent='— '+q.a;
}
showQuote();

function updateClock(){

const opts={weekday:'long',year:'numeric',month:'long',day:'numeric'};
const time=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
const date=now.toLocaleDateString('en-US',opts);
document.getElementById('clock').textContent=date+' • '+time;
}
updateClock();
setInterval(updateClock,60000);

// Daily Progress Report from Timetable
(function(){
    const schedule=[

{d:2,topic:"Project Q&A (16-29) + Tips/HR",c:"14+HR"},
{d:3,topic:"OOPs (1-10) — Pillars, Class, Constructor",c:"10"},
{d:4,topic:"OOPs (11-22) — Encapsulation, Modifiers",c:"12"},
{d:5,topic:"OOPs (23-31) — Inheritance, Composition",c:"10"},
{d:6,topic:"OOPs (32-44) — Polymorphism ★★★",c:"12"},
{d:7,topic:"Coding (1-10)",c:"10"},
{d:8,topic:"OOPs (45-58) — Abstraction, Interfaces",c:"14"},
{d:9,topic:"OOPs (59-72) — Generics, Boxing",c:"14"},
{d:10,topic:"OOPs (73-88) — Delegates, Events",c:"15"},
{d:11,topic:"OOPs (89-104) — Exceptions, LINQ",c:"15"},
{d:12,topic:"C# (1-10) — Basics, Boxing, Struct",c:"10"},

{d:14,topic:"Coding (11-20)",c:"10"},
{d:15,topic:"C# (23-35) — Nullable, Singleton",c:"13"},
{d:16,topic:"C# (36-50) — Virtual, Serialization",c:"15"},
{d:17,topic:"C# (51-70) — File, Hashtable",c:"15"},
{d:18,topic:"C# (71-85) — LINQ deep",c:"15"},
{d:19,topic:"C# (86-95) — async/await, .NET Core ★★★",c:"10"},
{d:20,topic:"SOLID (1-12) + DI (1-4)",c:"15"},
{d:21,topic:"Coding (21-30)",c:"10"},
{d:22,topic:"DI (5-8) + EF Core (1-6)",c:"10"},
{d:23,topic:"EF Core (7-12) + Web API (1-5)",c:"11"},
{d:24,topic:"Web API (6-15)",c:"10"},
{d:25,topic:"SQL (1-12) — Joins, Basics",c:"12"},
{d:26,topic:"SQL (13-26) — SP, Functions",c:"14"},
{d:27,topic:"SQL (27-40) — Advanced",c:"14"},
{d:28,topic:"Coding (31-40) + SQL (41-52)",c:"10+12"},
{d:29,topic:"ASP.NET Core (1-15) — Fundamentals",c:"15"},
{d:30,topic:"ASP.NET Core (16-30) — Controllers",c:"15"},
{d:31,topic:"ASP.NET Core (31-50) — Filters",c:"15"},
{d:32,topic:"ASP.NET Core (51-70) — State, Areas",c:"15"},
{d:33,topic:"ASP.NET Core (71-90) — Scenarios",c:"15"},
{d:34,topic:"ASP.NET Core (91-115) — Advanced",c:"15"},
{d:35,topic:"Coding revision — Redo hard ones",c:"10"},
{d:36,topic:"MVC (1-15) — Pattern, Model",c:"15"},
{d:37,topic:"MVC (16-30) — Views, Razor, Layout",c:"15"},
{d:38,topic:"MVC (31-50) — Controller, Data passing",c:"15"},
{d:39,topic:"MVC (51-70) — Model Binding, Validation",c:"15"},
{d:40,topic:"MVC (71-90) — Filters, Areas",c:"15"},
{d:41,topic:"MVC (91-115) — Scenarios",c:"15"},
{d:42,topic:"JavaScript (1-12) + Git (1-4)",c:"16"},
{d:43,topic:"REVISION — Project + Tips + HR",c:"All"},
{d:44,topic:"REVISION — ★★★ from all topics",c:"Random"}

    // Count questions studied per topic from localStorage
    function getStudiedCount(pageKey) {
        let count = 0;
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith(pageKey + '_q_') && localStorage.getItem(key) === '1') {
                count++;
            }
        }
        return count;
    }

    const topicPages = [
        {name:'OOPs', key:'oops_interview_questions', total:104},
        {name:'C#', key:'c#_interview_questions', total:95},
        {name:'SQL', key:'sql_interview_questions', total:52},
        {name:'MVC', key:'mvc_interview_questions', total:115},
        {name:'ASP.NET', key:'asp.net_core_interview_questions', total:115},
        {name:'Web API', key:'web_api_interview_questions', total:15},
        {name:'EF Core', key:'ef_core_interview_questions', total:12},
        {name:'SOLID', key:'solid_principles', total:12},
        {name:'DI', key:'dependency_injection', total:8},
        {name:'Git', key:'git_interview_questions', total:12},
        {name:'JS', key:'javascript_interview_questions', total:12},
        {name:'Oracle', key:'oracle_interview_questions', total:30},
        {name:'Coding', key:'coding_interview_questions', total:40}
    ];

    let totalStudied = 0;
    let totalQuestions = 0;
    let topicProgress = [];

    topicPages.forEach(function(t) {
        const studied = getStudiedCount(t.key);
        totalStudied += studied;
        totalQuestions += t.total;
        topicProgress.push({name: t.name, studied: studied, total: t.total});
    });

    const qPercent = totalQuestions > 0 ? Math.round((totalStudied / totalQuestions) * 100) : 0;

    if (currentDay > 44) {
        el.innerHTML = `<div style="text-align:center"><div style="font-size:1.5rem;margin-bottom:8px">🏆</div><div style="font-size:.9rem;font-weight:700;color:#10b981">All 44 Days Completed! You're interview ready! 🔥</div></div>`;
    } else {

    const today = schedule[currentDay - 1];

    let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span style="font-size:.85rem;font-weight:700;color:#38bdf8">📊 Daily Progress</span>
        <span style="font-size:.72rem;color:#64748b">Day ${currentDay}/44 • ${completedDays} days done</span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:.75rem;color:#94a3b8">Questions Covered</span>
        <span style="font-size:.82rem;font-weight:700;color:#10b981">${totalStudied}/${totalQuestions} (${qPercent}%)</span>
    </div>
    <div style="height:8px;background:#1e3a5f;border-radius:4px;overflow:hidden;margin-bottom:14px">
        <div style="height:100%;width:${qPercent}%;background:linear-gradient(90deg,#10b981,#34d399);border-radius:4px;transition:width .5s"></div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">`;

    topicProgress.forEach(function(t) {
        const pct = t.total > 0 ? Math.round((t.studied / t.total) * 100) : 0;
        const color = pct >= 80 ? '#10b981' : pct >= 40 ? '#f59e0b' : '#64748b';
        html += `<div style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:4px 8px;font-size:.65rem">
            <span style="color:${color};font-weight:700">${t.name}</span> <span style="color:#64748b">${t.studied}/${t.total}</span>
        </div>`;
    });

    html += '</div>';

    // Today's schedule
    html += `<div style="padding:10px 12px;background:rgba(245,158,11,.08);border-left:3px solid #f59e0b;border-radius:0 6px 6px 0;font-size:.8rem">
        <div style="color:#f59e0b;font-weight:700;margin-bottom:4px">📖 Today — Day ${currentDay}</div>
        <div style="color:#e2e8f0;font-weight:600">${today.topic}</div>
        <div style="color:#64748b;font-size:.72rem;margin-top:4px">Questions: ${today.c}</div></div>`;

    el.innerHTML = html;
    } // end else

    // Always draw chart based on questions covered
    drawChart(completedDays, totalStudied, totalQuestions);
})();

function drawChart(completedDays, totalStudied, totalQuestions) {
    const canvas = document.getElementById('progressChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const centerX = 65, centerY = 65, radius = 55, lineWidth = 15;

    // Topic-wise breakdown from timetable
    const topics = [
        {name:'OOPs', days:9, color:'#f97316'},
        {name:'C#', days:8, color:'#a855f7'},
        {name:'SQL', days:4, color:'#ec4899'},
        {name:'ASP.NET', days:6, color:'#14b8a6'},
        {name:'MVC', days:6, color:'#3b82f6'},
        {name:'Coding', days:5, color:'#ef4444'},
        {name:'Others', days:6, color:'#6366f1'}
    ];

    // Calculate completed per topic
    const ttData = JSON.parse(localStorage.getItem('tt44') || '{}');
    const topicRanges = [
        {name:'OOPs',start:3,end:11,color:'#f97316'},
        {name:'C#',start:12,end:19,color:'#a855f7'},
        {name:'SQL',start:25,end:28,color:'#ec4899'},
        {name:'ASP.NET',start:29,end:34,color:'#14b8a6'},
        {name:'MVC',start:36,end:41,color:'#3b82f6'},
        {name:'Coding',start:7,end:7,color:'#ef4444',extra:[14,21,28,35]},
        {name:'Others',start:1,end:2,color:'#6366f1',extra:[20,22,23,24,42,43,44]}
    ];

    // Clear canvas
    ctx.clearRect(0, 0, 130, 130);

    // Draw background ring
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
    ctx.strokeStyle = '#1e3a5f';
    ctx.lineWidth = lineWidth;
    ctx.stroke();

    // Draw segments
    let startAngle = -Math.PI / 2;
    const total = 44;

    topics.forEach(function(topic) {
        const angle = (topic.days / total) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, startAngle, startAngle + angle);
        ctx.strokeStyle = topic.color;
        ctx.lineWidth = lineWidth;
        ctx.lineCap = 'butt';
        ctx.stroke();
        startAngle += angle;
    });

    // Draw center hole (for doughnut effect)
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius - lineWidth, 0, Math.PI * 2);
    ctx.fillStyle = '#0f172a';
    ctx.fill();

    // Center text
    const percent = totalQuestions > 0 ? Math.round((totalStudied / totalQuestions) * 100) : 0;
    ctx.fillStyle = '#10b981';
    ctx.font = 'bold 18px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText(percent + '%', centerX, centerY + 2);
    ctx.fillStyle = '#64748b';
    ctx.font = '9px Segoe UI';
    ctx.fillText(totalStudied + '/' + totalQuestions + ' Qs', centerX, centerY + 16);

    // Draw completed overlay (grey out remaining)
    const qPercent2 = totalQuestions > 0 ? totalStudied / totalQuestions : 0;
    if (qPercent2 < 1) {
        const completedAngle = qPercent2 * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, -Math.PI/2 + completedAngle, -Math.PI/2 + Math.PI*2);
        ctx.strokeStyle = 'rgba(30,58,95,.7)';
        ctx.lineWidth = lineWidth;
        ctx.stroke();
    }

    // Legend
    const legend = document.getElementById('chartLegend');
    if (legend) {
        legend.innerHTML = topics.map(t => 
            `<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
                <span style="width:10px;height:10px;border-radius:2px;background:${t.color};display:inline-block"></span>
                <span style="color:#94a3b8">${t.name} (${t.days}d)</span>
            </div>`
        ).join('');
    }
}

// Last visited tracker
(function(){
    const last = localStorage.getItem('lastVisitedPage');
    const lastTime = localStorage.getItem('lastVisitedTime');
    if(last && lastTime){
        const el = document.getElementById('lastVisited');
        el.style.display = 'block';

// Weak Topics indicator
(function(){
    function getStudiedCount(pageKey) {
        let count = 0;
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith(pageKey + '_q_') && localStorage.getItem(key) === '1') count++;
        }
        return count;
    }
    const topics = [
        {name:'OOPs', key:'oops_interview_questions', total:104},
        {name:'C#', key:'c#_interview_questions', total:95},
        {name:'SQL', key:'sql_interview_questions', total:52},
        {name:'MVC', key:'mvc_interview_questions', total:115},
        {name:'ASP.NET', key:'asp.net_core_interview_questions', total:115},
        {name:'Web API', key:'web_api_interview_questions', total:15},
        {name:'EF Core', key:'ef_core_interview_questions', total:12},

        {name:'DI', key:'dependency_injection', total:8},

        {name:'JS', key:'javascript_interview_questions', total:12},
        {name:'Oracle', key:'oracle_interview_questions', total:30}
    ];
    const weak = topics.filter(t => {
        const pct = (getStudiedCount(t.key) / t.total) * 100;
        return pct < 30;
    }).map(t => t.name);
    if (weak.length > 0 && weak.length < topics.length) {
        const el = document.getElementById('weakTopics');
        el.style.display = 'block';
        el.innerHTML = `⚠️ <strong>Weak Topics:</strong> ${weak.join(', ')} — <span style="color:#94a3b8">Less than 30% covered. Focus here!</span>`;

// Interview Countdown Timer
(function(){
    let interviewDate = localStorage.getItem('interviewDate');
    const el = document.getElementById('countdown');
    
    if (!interviewDate) {
        el.style.display = 'block';
        el.innerHTML = `⏰ <a href="#" onclick="setInterviewDate();return false" style="color:#a78bfa;text-decoration:underline">Set your interview date</a> to see countdown`;
    } else {
        const diff = Math.ceil((new Date(interviewDate) - new Date()) / (1000*60*60*24));
        el.style.display = 'block';
        if (diff > 0) {
            const color = diff <= 7 ? '#ef4444' : diff <= 14 ? '#f59e0b' : '#a78bfa';
            el.innerHTML = `⏰ <strong style="color:${color}">${diff} days</strong> until interview (${new Date(interviewDate).toLocaleDateString('en-US',{month:'short',day:'numeric'})}) <a href="#" onclick="setInterviewDate();return false" style="color:#64748b;font-size:.7rem;margin-left:8px">change</a>`;
        } else if (diff === 0) {
            el.innerHTML = `🔥 <strong style="color:#ef4444">TODAY is your interview!</strong> You've got this! 💪`;
        } else {
            el.innerHTML = `✅ Interview date passed. <a href="#" onclick="setInterviewDate();return false" style="color:#a78bfa;text-decoration:underline">Set new date</a>`;
        }
    }
})();

function setInterviewDate() {
    const date = prompt('Enter your interview date (YYYY-MM-DD):');
    if (date && !isNaN(new Date(date).getTime())) {
        localStorage.setItem('interviewDate', date);
        location.reload();
    } else if (date) {
        alert('Invalid date format. Use YYYY-MM-DD (e.g., 2025-02-15)');
    }
}

// Daily goal based on day
(function(){
    const goals = [
        'Sunday: Coding practice day! Solve 10 problems 💻',
        'Monday: Start fresh! Target 15 questions today 🚀',
        'Tuesday: Deep dive into a topic. 10-15 Qs 📖',
        'Wednesday: Mid-week push! 15 questions 💪',
        'Thursday: Keep the momentum. 10-15 Qs 🔥',
        'Friday: Almost there! 15 questions today 🎯',
        'Saturday: Weekend revision. Redo weak topics 🔄'
    ];
    const day = new Date().getDay();
    const el = document.getElementById('dailyGoal');
    el.style.display = 'block';
    el.innerHTML = `🎯 Today's Goal: ${goals[day]}`;
})();
</script>
